<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>留言区 | 诗情画奕的备忘录</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@waline/client@v3/dist/waline.css">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    background: #f3eef9;
    color: #333;
    line-height: 1.7;
  }
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px 16px 60px;
  }

  .back-home {
    display: inline-block;
    text-decoration: none;
    color: #8b5cf6;
    margin-bottom: 20px;
    font-size: 15px;
  }
  .back-home:hover {
    text-decoration: underline;
  }

  /* 胶囊Tab样式 + 居中 */
  .tab-wrap {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    justify-content: center;
  }
  .tab-item {
    padding: 8px 20px;
    border: 1px solid #ddd4ee;
    background: #fff;
    color: #666;
    font-size: 15px;
    cursor: pointer;
    border-radius: 999px;
    transition: 0.2s;
  }
  .tab-item.active {
    background: #8b5cf6;
    color: #fff;
    border-color: #8b5cf6;
  }
  .tab-item:hover:not(.active) {
    border-color: #8b5cf6;
    color: #8b5cf6;
  }

  .tab-panel {
    display: none;
  }
  .tab-panel.active {
    display: block;
  }

  /* Waline 主题配色，和你网站统一 */
  .waline {
    --waline-theme-color: #8b5cf6;
    --waline-active-color: #7c3aed;
  }
  .waline-input, .waline-textarea {
    border-radius: 8px;
    border:1px solid #ddd4ee;
    background:#fff;
  }
  .waline-submit {
    border-radius:8px;
    background:#8b5cf6;
  }
  .waline-submit:hover {
    background:#7c3aed;
  }
  .waline-comment-item {
    background:#f8f5fe;
    border-radius:10px;
    padding:12px;
    margin:10px 0;
  }
  .waline-divider {
    border-color:#e1d8f2;
  }
</style>
</head>
<body>
  <main class="container">
    <a class="back-home" href="index.html">← 返回首页导航</a>

    <div class="tab-wrap">
      <button class="tab-item active" data-tab="tab1">对41的祝福</button>
      <button class="tab-item" data-tab="tab2">给网站的建议</button>
    </div>

    <div class="tab-panel active" id="tab1">
      <div id="waline-yyzy"></div>
    </div>
    <div class="tab-panel" id="tab2">
      <div id="waline-suggest"></div>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@waline/client@v3/dist/waline.js"></script>
<script>
// Tab切换逻辑
const tabs = document.querySelectorAll('.tab-item');
const panels = document.querySelectorAll('.tab-panel');
tabs.forEach(btn=>{
  btn.onclick = ()=>{
    const targetId = btn.dataset.tab;
    tabs.forEach(b=>b.classList.remove('active'));
    panels.forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(targetId).classList.add('active');
  }
})

// 两个独立Waline，path分开，数据隔离
Waline.init({
  el: '#waline-yyzy',
  serverURL: 'https://4781.supabase.co',
  path: '/comment-yyzy',
  placeholder: '写下你想对诗情画奕说的话💜',
  meta: ['nick','mail','link'],
  requiredMeta: ['nick'],
  lang: 'zh-CN',
  dark: 'auto'
});

Waline.init({
  el: '#waline-suggest',
  serverURL: 'https://4781.supabase.co',
  path: '/comment-suggest',
  placeholder: '对这个存档网站的建议、bug反馈✨',
  meta: ['nick','mail','link'],
  requiredMeta: ['nick'],
  lang: 'zh-CN',
  dark: 'auto'
});
</script>
</body>
</html>
